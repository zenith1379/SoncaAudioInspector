# U2 only: add inside BOTH inventory.acnos.store server blocks (80 and 443).
# Run nginx -t before reload. This directory is static; no Next.js/database changes.
location = /update { absolute_redirect off; return 302 /updates/audio-inspector/; }
location = /update/ { absolute_redirect off; return 302 /updates/audio-inspector/; }
location ^~ /updates/audio-inspector/ {
    alias /opt/speaker-inventory/updates/audio-inspector/;
    autoindex off;
    index index.html;
    limit_except GET HEAD { deny all; }

    location ~ ^/updates/audio-inspector/(latest\.json(?:\.sig)?)$ {
        alias /opt/speaker-inventory/updates/audio-inspector/$1;
        add_header Cache-Control "no-cache" always;
    }
    location = /updates/audio-inspector/index.html {
        alias /opt/speaker-inventory/updates/audio-inspector/index.html;
        add_header Cache-Control "no-cache" always;
    }
    location /updates/audio-inspector/files/ {
        alias /opt/speaker-inventory/updates/audio-inspector/files/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # Temporary pointer uploads must never be served.
    location ~ /\. { deny all; }
}
